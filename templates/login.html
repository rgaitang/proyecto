<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema de Horarios</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex;
               justify-content: center; align-items: center; min-height: 100vh; }
        .login-box { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.1);
                     width: 100%; max-width: 400px; }
        h1 { text-align: center; color: #1a73e8; margin-bottom: 5px; font-size: 24px; }
        p.sub { text-align: center; color: #666; margin-bottom: 25px; font-size: 14px; }
        label { display: block; margin: 12px 0 5px; font-weight: 600; color: #333; font-size: 14px; }
        input { width: 100%; padding: 11px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; }
        input:focus { outline: none; border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26,115,232,0.15); }
        button { width: 100%; margin-top: 22px; padding: 12px; background: #1a73e8; color: #fff; border: none;
                 border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; }
        button:hover { background: #1558b0; }
        .flash { padding: 10px 14px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; }
        .flash.success { background: #e6f4ea; color: #137333; }
        .flash.danger { background: #fce8e6; color: #c5221f; }
        .flash.warning { background: #fef7e0; color: #b06000; }
        .flash.info { background: #e8f0fe; color: #1a73e8; }
    </style>
</head>
<body>
    <div class="login-box">
        <img src="{{ url_for('static', filename='logo.jpg') }}" alt="SOLOFARMA"
             style="max-width:180px; display:block; margin:0 auto 15px; border-radius:8px;">
        <h1>Sistema de Horarios</h1>
        <p class="sub">SOLOFARMA - Reporte de turnos y novedades</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for cat, msg in messages %}
            <div class="flash {{ cat }}">{{ msg }}</div>
          {% endfor %}
        {% endwith %}
        <form method="POST">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" required>
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">Ingresar</button>
        </form>
    </div>
</body>
</html>
